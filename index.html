<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>화석 탐험 도감</title>
  <style>
    /* 레트로 폰트 및 기본 설정 */
    @import url('https://fonts.googleapis.com/css2?family=DungGeunMo&display=swap');
    
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'DungGeunMo', sans-serif; /* 레트로 픽셀 폰트 */
      background-color: #2b2b2b;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    #app {
      width: 100%;
      max-width: 480px;
      background-color: #f8f8f8;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
      border-left: 4px solid #000;
      border-right: 4px solid #000;
    }

    /* 포켓몬 도감(레트로) 스타일 헤더 */
    header {
      background-color: #e52521;
      color: white;
      padding: 15px;
      text-align: center;
      border-bottom: 4px solid #000;
      position: relative;
    }
    
    .screen { display: none; padding: 20px; }
    .screen.active { display: block; }

    /* 로그인 화면 */
    .input-group { margin-bottom: 15px; }
    .input-group label { display: block; margin-bottom: 5px; font-size: 14px; }
    .input-group input { 
      width: 100%; padding: 10px; border: 2px solid #000; 
      font-family: 'DungGeunMo', sans-serif; font-size: 16px;
    }
    .btn {
      width: 100%; padding: 12px; background-color: #ffcb05; color: #000;
      border: 4px solid #000; font-family: 'DungGeunMo', sans-serif; font-size: 16px;
      cursor: pointer; margin-top: 10px;
    }
    .btn:active { transform: translateY(2px); }
    .btn:disabled { background-color: #ccc; cursor: not-allowed; }

    /* 도감 화면 */
    .progress-box {
      background: #fff; border: 2px solid #000; padding: 10px; margin-bottom: 20px;
      text-align: center;
    }
    .progress-bar {
      height: 20px; background: #eee; border: 2px solid #000; margin-top: 10px;
      position: relative;
    }
    .progress-fill {
      height: 100%; background: #4caf50; width: 0%; transition: width 0.3s;
    }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .fossil-card {
      background: #fff; border: 2px solid #000; border-radius: 8px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 10px; height: 100px; text-align: center;
    }
    .fossil-card.locked { background: #bbb; filter: grayscale(100%); }
    .fossil-icon { font-size: 32px; margin-bottom: 5px; }
    .fossil-name { font-size: 12px; }

    /* 퀴즈 화면 */
    .quiz-box {
      background: #fff; border: 4px solid #000; padding: 20px; margin-bottom: 20px;
      border-radius: 8px;
    }
    .quiz-question { font-size: 18px; line-height: 1.4; margin-bottom: 20px; word-break: keep-all; }
    .option-btn {
      display: block; width: 100%; padding: 12px; margin-bottom: 10px;
      background: #f0f0f0; border: 2px solid #000; text-align: left;
      font-family: inherit; font-size: 14px; cursor: pointer;
    }
    .option-btn:hover { background: #e0e0e0; }

    /* 모달 (최종 인증 등) */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center;
      z-index: 100;
    }
    .modal-content {
      background: #fff; border: 4px solid #000; padding: 20px; width: 90%; max-width: 400px;
      text-align: center; position: relative;
    }
    .stamp {
      color: red; border: 4px solid red; border-radius: 50%; width: 100px; height: 100px;
      display: flex; align-items: center; justify-content: center; font-size: 24px;
      font-weight: bold; transform: rotate(-15deg); margin: 20px auto;
    }
  </style>
</head>
<body>

<div id="app">
  <header>
    <h1>🔬 사이언스 덱스</h1>
  </header>

  <!-- 1. 로그인 화면 -->
  <div id="view-login" class="screen">
    <h2 style="text-align:center; margin-bottom: 20px;">연구원 등록</h2>
    <div class="input-group">
      <label>학년/반 (예: 1학년 2반 -> 102)</label>
      <input type="number" id="input-class" placeholder="반 입력">
    </div>
    <div class="input-group">
      <label>번호</label>
      <input type="number" id="input-num" placeholder="번호 입력">
    </div>
    <div class="input-group">
      <label>이름</label>
      <input type="text" id="input-name" placeholder="이름 입력">
    </div>
    <button class="btn" onclick="app.login()">탐험 시작하기</button>
  </div>

  <!-- 2. 도감 화면 -->
  <div id="view-dex" class="screen">
    <div class="progress-box">
      <div id="user-info" style="font-size:14px; margin-bottom:5px;"></div>
      <h3>수집 진행률 (<span id="progress-text">0</span>/18)</h3>
      <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
    </div>
    <div class="grid" id="fossil-grid"></div>
    <br>
    <button class="btn" id="btn-submit" onclick="app.showCertificate()" disabled>최종 도감 제출하기</button>
  </div>

  <!-- 3. 퀴즈 화면 -->
  <div id="view-quiz" class="screen">
    <h2 style="color: #e52521; text-align: center; margin-bottom: 10px;">앗! 야생의 화석이 나타났다!</h2>
    <div style="text-align: center; font-size: 60px; margin-bottom: 10px;" id="quiz-icon">🦴</div>
    <div class="quiz-box">
      <div class="quiz-question" id="quiz-q"></div>
      <div id="quiz-options"></div>
    </div>
    <button class="btn" onclick="app.goToDex()">도망치기 (도감으로)</button>
  </div>
</div>

<!-- 인증 모달 -->
<div class="modal-overlay" id="modal-cert">
  <div class="modal-content">
    <h2 style="color: #e52521;">🎉 화석 도감 완성!</h2>
    <div class="stamp">참 잘했어요</div>
    <p id="cert-info" style="margin: 10px 0; font-size: 16px;"></p>
    <p id="cert-time" style="margin: 10px 0; font-size: 14px; color: #555;"></p>
    <button class="btn" onclick="document.getElementById('modal-cert').style.display='none'">닫기</button>
  </div>
</div>

<script>
// 화석 데이터 (18개)
const fossilData = [
  { id: 1, name: "삼엽충", icon: "🐛", q: "고생대를 대표하는 바다 생물로, 세 개의 엽으로 나뉜 등껍질을 가진 화석은?", options: ["공룡", "삼엽충", "매머드", "암모나이트" ], ans: 1 },
  { id: 2, name: "암모나이트", icon: "🐚", q: "중생대 바다에 살았던 나선형 껍데기를 가진 두족류 화석은?", options: ["삼엽충", "시조새", "갑주어", "암모나이트" ], ans: 3 },
  { id: 3, name: "티라노사우루스", icon: "🦖", q: "중생대 백악기에 살았던 거대한 육식 공룡은?", options: ["트리케라톱스", "스테고사우루스", "티라노사우루스", "브라키오사우루스"], ans: 2 },
  { id: 4, name: "고사리", icon: "🌿", q: "고생대에 번성하였으며, 오늘날 석탄의 주원료가 된 식물 화석은?", options: ["소철", "고사리", "은행나무", "속씨식물"], ans: 1 },
  { id: 5, name: "매머드", icon: "🐘", q: "신생대 빙하기에 살았으며, 온몸이 털로 덮여 있던 코끼리와 비슷한 동물은?", options: ["검치호", "매머드", "시조새", "실러캔스"], ans: 1 },
  { id: 6, name: "시조새", icon: "🦅", q: "파충류와 조류의 특징을 모두 가지고 있어 진화의 증거가 되는 화석은?", options: ["타조", "익룡", "시조새", "티라노사우루스"], ans: 2 },
  { id: 7, name: "호박", icon: "🍯", q: "나무의 진액이 굳어져 만들어진 화석으로, 곤충이 갇혀 있는 경우가 많은 것은?", options: ["석탄", "규화목", "호박", "석유"], ans: 2 },
  { id: 8, name: "규화목", icon: "🪵", q: "나무줄기가 땅속에 묻힌 후 광물질이 스며들어 돌처럼 굳어진 화석은?", options: ["호박", "규화목", "스트로마톨라이트", "석탄"], ans: 1 },
  { id: 9, name: "검치호", icon: "🐯", q: "대륙의 이동과 분리가 진행되어 오늘날과 비슷한 수륙 분포를 이루게 된 지질 시대는?", options: ["선캄브리아시대", "고생대", "중생대", "신생대"], ans: 3 },
  { id: 10, name: "실러캔스", icon: "🐟", q: "오존층이 형성되어 자외선이 차단되면서 생물이 육상으로 진출하기 시작한 지질 시대는?", options: ["선캄브리아시대", "고생대", "중생대", "신생대"], ans: 1 },
  { id: 11, name: "스트로마톨라이트", icon: "🪨", q: "남세균의 활동으로 층을 이루며 퇴적된, 지구 최고(最古)의 생물 흔적 화석은?", options: [ "산호", "방추충", "암모나이트", "스트로마톨라이트"], ans: 3 },
  { id: 12, name: "공룡 발자국", icon: "🐾", q: "생물의 몸체가 아닌, 활동 흔적이 남아 생성된 '생흔 화석'에 해당하는 것은?", options: ["공룡 뼈", "공룡 발자국", "호박 속 모기", "얼어붙은 매머드"], ans: 1 },
  { id: 13, name: "방추충(푸줄리나)", icon: "쌀", q: "고생대 말기의 얕은 바다에 살았던 쌀알 모양의 유공충 화석은?", options: ["삼엽충", "화폐석", "방추충", "암모나이트"], ans: 2 },
  { id: 14, name: "화폐석", icon: "🪙", q: "신생대의 따뜻하고 얕은 바다에 살았던 동전 모양의 화석은?", options: ["화폐석", "방추충", "삼엽충", "암모나이트"], ans: 0 },
  { id: 15, name: "스테고사우루스", icon: "🦕", q: "암모나이트와 은행나무와 같은 겉씨 식물이 번성한 지질 시대는?", options: ["선캄브리아시대", "고생대", "중생대", "신생대"], ans: 2 },
  { id: 16, name: "트리케라톱스", icon: "🦏", q: "고생대 지층에서 발견할 수 없는 화석은?", options: ["갑주어", "삼엽충", "방추충", "공룡"], ans: 3 },
  { id: 17, name: "메갈로돈", icon: "🦈", q: "지질시대 중 가장 큰 대멸종이 일어난 시기는?", options: ["고생대 초기", "고생대 중기", "고생대 말기", "중생대 말기"], ans: 2 },
  { id: 18, name: "산호", icon: "🪸", q: "따뜻하고 얕은 바다에서 서식하므로, 과거 그 지역의 환경을 알려주는 '시상 화석'은?", options: ["공룡", "산호", "삼엽충", "암모나이트"], ans: 1 }
];

const app = {
  user: null,
  currentFossilId: null,

  init() {
    // 로컬스토리지에서 유저 정보 확인
    const saved = localStorage.getItem('scienceFossilDex');
    if (saved) {
      this.user = JSON.parse(saved);
    }

    // URL 파라미터에서 QR코드 화석 ID 확인
    const urlParams = new URLSearchParams(window.location.search);
    this.currentFossilId = urlParams.get('fossil_id');

    this.route();
  },

  route() {
    // 1. 유저 정보가 없으면 무조건 로그인 창
    if (!this.user) {
      this.showScreen('view-login');
      return;
    }
    
    // 2. 유저 정보가 있고, QR을 찍고 들어왔다면 퀴즈 화면
    if (this.currentFossilId) {
      const target = fossilData.find(f => f.id == this.currentFossilId);
      if (target) {
        // 이미 수집했는지 확인
        if (this.user.collected.includes(target.id)) {
          alert("이미 수집한 화석입니다!");
          this.removeUrlParam();
          this.renderDex();
          this.showScreen('view-dex');
        } else {
          this.renderQuiz(target);
          this.showScreen('view-quiz');
        }
        return;
      }
    }
    
    // 3. 둘 다 아니면 도감 화면
    this.renderDex();
    this.showScreen('view-dex');
  },

  login() {
    const cls = document.getElementById('input-class').value;
    const num = document.getElementById('input-num').value;
    const name = document.getElementById('input-name').value;

    if (!cls || !num || !name) {
      alert('반, 번호, 이름을 모두 입력해주세요!');
      return;
    }

    this.user = {
      class: cls, num: num, name: name,
      startTime: Date.now(),
      collected: []
    };
    this.saveData();
    this.route();
  },

  saveData() {
    localStorage.setItem('scienceFossilDex', JSON.stringify(this.user));
  },

  showScreen(id) {
    document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  },

  renderDex() {
    // 정보 및 진행률 갱신
    document.getElementById('user-info').innerText = `[${this.user.class}반 ${this.user.num}번 ${this.user.name}] 연구원`;
    
    const count = this.user.collected.length;
    document.getElementById('progress-text').innerText = count;
    document.getElementById('progress-fill').style.width = `${(count / 18) * 100}%`;

    // 그리드 렌더링
    const grid = document.getElementById('fossil-grid');
    grid.innerHTML = '';
    fossilData.forEach(fossil => {
      const isCollected = this.user.collected.includes(fossil.id);
      grid.innerHTML += `
        <div class="fossil-card ${isCollected ? '' : 'locked'}">
          <div class="fossil-icon">${isCollected ? fossil.icon : '🔒'}</div>
          <div class="fossil-name">${isCollected ? fossil.name : '???'}</div>
        </div>
      `;
    });

    // 최종 버튼 활성화 여부
    document.getElementById('btn-submit').disabled = (count < 18);
  },

  renderQuiz(fossil) {
    document.getElementById('quiz-icon').innerText = fossil.icon;
    document.getElementById('quiz-q').innerText = fossil.q;
    
    const optsBox = document.getElementById('quiz-options');
    optsBox.innerHTML = '';
    fossil.options.forEach((opt, idx) => {
      optsBox.innerHTML += `<button class="option-btn" onclick="app.checkAnswer(${fossil.id}, ${idx})">${idx + 1}. ${opt}</button>`;
    });
  },

  checkAnswer(fossilId, selectedIdx) {
    const fossil = fossilData.find(f => f.id === fossilId);
    if (fossil.ans === selectedIdx) {
      alert("🎉 포획 성공! 도감에 등록되었습니다.");
      this.user.collected.push(fossil.id);
      this.saveData();
      this.removeUrlParam();
      this.route(); // 도감으로 이동
    } else {
      alert("❌ 포획 실패! 다시 도전해보세요!");
    }
  },

  goToDex() {
    this.removeUrlParam();
    this.route();
  },

  removeUrlParam() {
    // 주소창에서 파라미터 지우기 (새로고침 시 다시 퀴즈 안뜨게)
    this.currentFossilId = null;
    const cleanUrl = window.location.protocol + "//" + window.location.host + window.location.pathname;
    window.history.replaceState({path: cleanUrl}, '', cleanUrl);
  },

 showCertificate() {
    const end = Date.now();
    const elapsedSec = Math.floor((end - this.user.startTime) / 1000);
    const m = Math.floor(elapsedSec / 60);
    const s = elapsedSec % 60;
    const elapsedStr = `${m}분 ${s}초`;
    
    const d = new Date();
    const timeStr = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`;

    // 1. 화면에 인증서 띄우기
    document.getElementById('cert-info').innerText = `${this.user.class}반 ${this.user.num}번 ${this.user.name}`;
    document.getElementById('cert-time').innerHTML = `완료 시각: ${timeStr}<br>총 소요 시간: ${elapsedStr}`;
    document.getElementById('modal-cert').style.display = 'flex';

    // 2. 구글 스프레드시트로 데이터 몰래 전송하기
    // ★★★ 아래 따옴표 안의 주소를 선생님이 발급받은 '웹앱 URL'로 바꾸세요! ★★★
    const scriptUrl = "https://script.google.com/macros/s/AKfycbxRdGg8Nr6EnQSyU8NQuf-v79d-vdo0z7WJ8VbDfO8OcnqBdVLFG7jpsSRC-6zuta3h/exec"; 
    
    const sendUrl = `${scriptUrl}?classNum=${this.user.class}&studentNum=${this.user.num}&name=${this.user.name}&elapsed=${elapsedStr}`;
    
    // 서버로 데이터 전송 (no-cors 모드로 백그라운드 전송)
    fetch(sendUrl, { mode: 'no-cors' })
      .then(() => console.log("구글 시트로 전송 완료!"))
      .catch(error => console.error("전송 에러:", error));
  }

window.onload = () => app.init();
</script>

</body>
</html>

<!--
=============================================================================
[선생님을 위한 QR코드 만들기 가이드]

1. 위 코드를 웹 호스팅(예: GitHub Pages)에 올려 접속 가능한 기본 주소를 얻습니다.
   (예시: https://my-science-class.github.io/fossil-dex/ )

2. 각 화석별 QR 코드를 생성하려면, 기본 주소 뒤에 '?fossil_id=번호' 를 붙여서 QR 코드를 생성합니다.
   
   * 1번 삼엽충 QR코드 URL: https://my-science-class.github.io/fossil-dex/?fossil_id=1
   * 2번 암모나이트 QR코드 URL: https://my-science-class.github.io/fossil-dex/?fossil_id=2
   * 3번 티라노 QR코드 URL: https://my-science-class.github.io/fossil-dex/?fossil_id=3
   ...
